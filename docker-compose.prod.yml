version: '3.8'

services:
  app:
    image: ${DOCKER_HUB_USERNAME}/ai_geologia:latest
    volumes:
      - /home/deployer/ai_geologia/relatorios:/app/relatorios
    networks:
      - ai_geologia_network

  nginx:
    image: ${DOCKER_HUB_USERNAME}/ai_geologia_nginx:latest
    ports:
      - "8080:80"  # Porta HTTP
      - "8443:443" # Porta HTTPS
    volumes:
      - /home/deployer/ai_geologia/nginx/ssl:/etc/nginx/ssl
    networks:
      - ai_geologia_network
    depends_on:
      - app

networks:
  ai_geologia_network:
    driver: bridge
