name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    
    - name: Build and push App image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/ai_geologia:latest

    - name: Test SSH Connection
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_SSH_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          whoami
          pwd
          echo "SSH connection successful!"

    - name: Copy docker-compose to VPS
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_SSH_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "docker-compose.prod.yml"
        target: "/home/deployer/ai_geologia"
        overwrite: true

    - name: Create .env file and deploy
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_SSH_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        envs: OPENAI_API_KEY,WHATSAPP_API_KEY,WHATSAPP_API_URL,DOCKER_HUB_USERNAME
        script: |
          # Criar diretórios necessários
          mkdir -p /home/deployer/ai_geologia/relatorios
          
          # Criar arquivo .env
          cat > /home/deployer/ai_geologia/.env << EOL
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          EVOLUTION_BASE_URL=${{ secrets.EVOLUTION_BASE_URL }}
          EVOLUTION_API_TOKEN=${{ secrets.EVOLUTION_API_TOKEN }}
          EVOLUTION_INSTANCE=${{ secrets.EVOLUTION_INSTANCE }}
          EVOLUTION_INSTANCE_TOKEN=${{ secrets.EVOLUTION_INSTANCE_TOKEN }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          EOL
          
          # Export da variável de ambiente
          export DOCKER_HUB_USERNAME="${{ secrets.DOCKER_HUB_USERNAME }}"
          
          # Deploy usando docker stack
          cd /home/deployer/ai_geologia
          docker stack deploy -c docker-compose.prod.yml ai_geologia --with-registry-auth
          
          # Limpeza de recursos não utilizados
          docker system prune -af --filter "until=72h"
          docker volume prune -f
