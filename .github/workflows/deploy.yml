name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push App image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/ai_geologia:latest

    - name: Build and push Nginx image
      uses: docker/build-push-action@v4
      with:
        context: ./nginx
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/ai_geologia_nginx:latest
    
    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # Criar rede Docker se não existir
          docker network create ai_geologia_network || true
          
          # Parar e remover containers existentes
          docker stop ai_geologia ai_geologia_nginx || true
          docker rm ai_geologia ai_geologia_nginx || true
          
          # Rodar a aplicação
          docker run -d \
            --name ai_geologia \
            --network ai_geologia_network \
            -v /path/to/relatorios:/app/relatorios \
            --restart unless-stopped \
            ${{ secrets.DOCKER_HUB_USERNAME }}/ai_geologia:latest
          
          # Rodar o Nginx
          docker run -d \
            --name ai_geologia_nginx \
            --network ai_geologia_network \
            -p 80:80 \
            -p 443:443 \
            -v /path/to/ssl/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro \
            -v /path/to/ssl/privkey.pem:/etc/nginx/ssl/privkey.pem:ro \
            --restart unless-stopped \
            ${{ secrets.DOCKER_HUB_USERNAME }}/ai_geologia_nginx:latest

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_SSH_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /home/renato/ai_geologia
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --build
          docker system prune -af --filter "until=72h"
          docker volume prune -f
