name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    
    - name: Build and push App image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/ai_geologia:latest

    - name: Build and push Nginx image
      uses: docker/build-push-action@v4
      with:
        context: ./nginx
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/ai_geologia_nginx:latest
    
    - name: Test SSH Connection
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_SSH_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          whoami
          pwd
          echo "SSH connection successful!"

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_SSH_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # Criar diretórios necessários
          mkdir -p /home/deployer/ai_geologia/relatorios
          sudo mkdir -p /home/deployer/ai_geologia/nginx/ssl
          
          # Configurar permissões
          sudo chown -R deployer:deployer /home/deployer/ai_geologia
          sudo chmod -R 755 /home/deployer/ai_geologia
          
          # Copiar docker-compose.prod.yml
          cp docker-compose.prod.yml /home/deployer/ai_geologia/
          
          # Deploy dos containers
          cd /home/deployer/ai_geologia
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --build
          
          # Limpeza de recursos não utilizados
          docker system prune -af --filter "until=72h"
          docker volume prune -f
